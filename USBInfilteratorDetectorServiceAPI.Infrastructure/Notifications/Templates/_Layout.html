<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#0f766e,#115e59);padding:28px 32px;color:#ffffff;">
              <div style="font-size:13px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.85;">USB Exfiltration Detector</div>
              <div style="font-size:24px;font-weight:700;margin-top:8px;line-height:1.3;">{{Heading}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {{Content}}
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:28px 0 0;">
                <tr>
                  <td align="center" style="border-radius:8px;background:#0f766e;">
                    <a href="{{PortalUrl}}" target="_blank" rel="noopener noreferrer"
                       style="display:inline-block;padding:12px 22px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">
                      Visit portal
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:14px 0 0;font-size:12px;line-height:1.5;color:#6b7280;">
                Or open this link:
                <a href="{{PortalUrl}}" target="_blank" rel="noopener noreferrer" style="color:#0f766e;word-break:break-all;">{{PortalUrl}}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px 28px;border-top:1px solid #e5e7eb;background:#fafafa;color:#6b7280;font-size:12px;line-height:1.6;">
              This message was sent by USB Exfiltration Detector. Do not reply to this email.
              If you did not expect this notice, contact your organization administrator.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
